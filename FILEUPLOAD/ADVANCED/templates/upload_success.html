<!DOCTYPE html>
<html>
<head>
    <title>Upload Success</title>
</head>
<body>
    <h2>✅ Files Uploaded Successfully</h2>
    <ul>
    {% for file in files %}
        <li>
            <a href="{{ url_for('uploaded_file', filename=file) }}" target="_blank">{{ file }}</a>
        </li>
    {% endfor %}
    </ul>
    <br>
    <a href="/">⬅ Back to Upload</a>
</body>
</html>
